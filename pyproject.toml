[project]
name = "usdata"
version = "0.11.0"
description = "Unified Python SDK and CLI for discovering, fetching, and tracking provenance of U.S. public scientific data"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["noaa", "usgs", "nasa", "open-data", "scientific-data", "provenance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.18",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
radar = ["xradar>=0.12.0"]
netcdf = ["xarray>=2025.1", "h5netcdf[h5py]>=1.8.1"]

[project.urls]
Homepage = "https://usdata.dev/"
Documentation = "https://docs.usdata.dev/"
Repository = "https://github.com/jakeryderv/usdata"

[project.scripts]
usdata = "usdata.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.6",
    "towncrier>=26.9",
]
docs = [
    "mkdocstrings-python>=2.0.8",
    "nbconvert>=7.17.1",
    "towncrier>=26.9",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
]
examples = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "pandas>=2.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
# Docstrings are required on the public API only; magic methods and __init__ are exempt.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "l0: pure in-memory logic",
    "l1: in-process components with controlled transport",
    "l2: local functional tests with filesystem or real decoders",
    "l3: controlled service deployment (currently unused)",
    "l4: production or upstream-live compatibility",
    "live: hits upstream services; requires --run-live",
    "integration: compatibility alias for live",
    "pandas: optional CSV reader coverage",
    "radar: optional radar reader coverage",
    "netcdf: optional NetCDF reader coverage",
]
addopts = "-ra --strict-markers"

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/jakeryderv/usdata/releases/tag/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/jakeryderv/usdata/issues/{issue})"
template = "scripts/templates/changelog.md.jinja"
wrap = false

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "development"
name = "Development"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal"
showcontent = true
