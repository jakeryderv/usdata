site_name: usdata
site_description: U.S. scientific data, with provenance and reproducible inputs
site_url: https://docs.usdata.dev/
docs_dir: docs
site_dir: .build/docs-site
repo_url: https://github.com/jakeryderv/usdata
repo_name: jakeryderv/usdata
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  custom_dir: docs/overrides
  features:
  - navigation.sections
  - navigation.indexes
  - navigation.path
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.progress
  - navigation.tracking
  - navigation.top
  - navigation.footer
  - toc.follow
  - content.code.copy
  palette:
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
extra:
  homepage: https://usdata.dev/
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/jakeryderv/usdata
  - icon: fontawesome/brands/python
    link: https://pypi.org/project/usdata/
nav:
- Start here:
  - index.md
  - Getting started: getting-started.md
  - Install: install.md
- Guides:
  - Find a dataset: guides/find-a-dataset.md
  - Fetch and analyze: guides/fetch-and-analyze.md
  - Pin inputs: guides/pin-inputs.md
  - Radar and satellite: guides/radar-and-satellite.md
  - Model output: guides/model-output.md
  - Severe weather labels: guides/severe-weather-labels.md
- Datasets:
  - generated/catalog/index.md
  - Versions and targets: generated/catalog/versions.md
  - Provider notes: providers/README.md
- Concepts:
  - How it works: concepts/how-it-works.md
  - Manifests and lockfiles: concepts/manifests.md
  - Readers: concepts/readers.md
  - Time and place: concepts/time-and-place.md
  - Provenance and drift: concepts/provenance-and-drift.md
- Reference:
  - Python API: reference/api.md
  - CLI: generated/cli.md
  - Reader options: reference/readers.md
  - Manifest schema: reference/manifests.md
  - Time selection: reference/selection.md
  - Places: reference/places.md
  - Upcoming changes: generated/changes.md
# Contributor and project-record pages stay in docs/ for GitHub readers but are
# not part of the user site; see ADR 0023. Snippets are included, not served.
exclude_docs: |
  overrides/
  architecture.md
  testing.md
  roadmap.md
  versioning.md
  guides/adding-a-dataset.md
  guides/documentation.md
  guides/website-operations.md
  adr/
  reviews/
  _snippets/
extra_css:
- assets/tokens.css
- assets/usdata.css
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths:
        - src
        options:
          docstring_style: google
          show_source: false
          show_root_heading: true
          show_signature_annotations: true
          separate_signature: true
          show_if_no_docstring: true
          heading_level: 3
          filters:
          - '!^_'
          - '!^model_config$'
          members_order: source
markdown_extensions:
- pymdownx.snippets:
    check_paths: true
    base_path:
    - docs
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn
