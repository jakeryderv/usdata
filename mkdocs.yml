site_name: usdata
site_description: U.S. scientific data, with provenance and reproducible inputs
site_url: https://docs.usdata.dev/
docs_dir: docs
site_dir: .build/docs-site
repo_url: https://github.com/jakeryderv/usdata
repo_name: jakeryderv/usdata
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.footer
  - content.code.copy
  palette:
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
nav:
- Website: https://usdata.dev/
- Start here:
  - Overview: index.md
  - Getting started: getting-started.md
  - Install: install.md
- Guides:
  - Fetch and analyze: guides/fetch-and-analyze.md
- Examples: https://usdata.dev/examples/
- Datasets:
  - Catalog: generated/catalog/index.md
  - Versions and targets: generated/catalog/versions.md
  - Provider notes: providers/README.md
- Reference:
  - Python API: reference/api.md
  - CLI: generated/cli.md
  - Readers: reference/readers.md
  - Manifests: reference/manifests.md
  - Places: reference/places.md
  - Temporal selection: reference/selection.md
  - Upcoming changes: generated/changes.md
# Contributor and project-record pages stay in docs/ for GitHub readers but are
# not part of the user site; see ADR 0023.
exclude_docs: |
  architecture.md
  testing.md
  roadmap.md
  versioning.md
  guides/adding-a-dataset.md
  guides/documentation.md
  guides/website-operations.md
  adr/
  reviews/
extra_css:
- assets/usdata.css
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths:
        - src
        options:
          docstring_style: google
          show_source: false
          show_root_heading: true
          show_signature_annotations: true
          separate_signature: true
          show_if_no_docstring: true
          heading_level: 3
          filters:
          - '!^_'
          - '!^model_config$'
          members_order: source
markdown_extensions:
- pymdownx.snippets:
    check_paths: true
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
