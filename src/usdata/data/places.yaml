# Named places resolvable in queries. Bounding boxes are approximate seeds
# (rounded to 0.1 degree) and will be replaced by values generated from
# Census cartographic boundary files. Keys are lowercased; aliases share a box.
places:
  oklahoma:   { aliases: [ok], bbox: { west: -103.0, south: 33.6, east: -94.4, north: 37.0 } }
  texas:      { aliases: [tx], bbox: { west: -106.7, south: 25.8, east: -93.5, north: 36.5 } }
  kansas:     { aliases: [ks], bbox: { west: -102.1, south: 37.0, east: -94.6, north: 40.0 } }
  california: { aliases: [ca], bbox: { west: -124.5, south: 32.5, east: -114.1, north: 42.0 } }
  florida:    { aliases: [fl], bbox: { west: -87.7, south: 24.4, east: -80.0, north: 31.0 } }
  colorado:   { aliases: [co], bbox: { west: -109.1, south: 37.0, east: -102.0, north: 41.0 } }
