    target: later
    title: Local Climatological Data
    description: >-
      Hourly, daily, and monthly observations from airport and first-order
      stations via the NCEI Access Data Service dataset
      local-climatological-data, addressed by WBAN-based station ids.
    keywords: [weather, hourly, airports, stations, lcd, ncei]
    protocol: http
    homepage: https://www.ncei.noaa.gov/products/land-based-station/local-climatological-data
    license: US Government Work (public domain)
    capabilities: { spatial_subset: false, temporal_subset: true, variable_subset: true }

  - id: noaa:ghcn-hourly
