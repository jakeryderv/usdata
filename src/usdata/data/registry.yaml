# Curated dataset registry: the single source of truth for what usdata knows about.
# Rendered exclusively to docs/generated/catalog/ by `just docs`.
#
# status: available = adapter implemented and tested (since: version it shipped in)
#         planned   = entry only, no adapter (target: version or later)
# domain: one of the ids under `domains:`; shared across providers.

providers:
  noaa:   { name: "NOAA",          homepage: https://www.noaa.gov/ }
  usgs:   { name: "USGS",          homepage: https://www.usgs.gov/ }
  nasa:   { name: "NASA",          homepage: https://www.earthdata.nasa.gov/ }
  epa:    { name: "EPA",           homepage: https://www.epa.gov/ }
  fema:   { name: "FEMA",          homepage: https://www.fema.gov/ }
  census: { name: "Census Bureau", homepage: https://www.census.gov/ }
  usda:   { name: "USDA",          homepage: https://www.usda.gov/ }

domains:
  surface-weather:        { name: "Surface weather" }
  severe-weather:         { name: "Severe weather" }
  weather-radar:          { name: "Weather radar" }
  weather-satellites:     { name: "Weather satellites" }
  tropical-cyclones:      { name: "Tropical cyclones" }
  weather-models:         { name: "Weather models" }
  climate:                { name: "Climate" }
  snow-ice:               { name: "Snow and ice" }
  ocean-physics:          { name: "Ocean physics" }
  sea-level-tides:        { name: "Sea level and tides" }
  ocean-chemistry:        { name: "Ocean chemistry" }
  marine-life:            { name: "Marine life and fisheries" }
  satellite-oceanography: { name: "Satellite oceanography" }
  bathymetry:             { name: "Bathymetry and hydrography" }
  coastal:                { name: "Coastal" }
  geophysics:             { name: "Geophysics" }
  natural-hazards:        { name: "Natural hazards" }
  paleoclimate:           { name: "Paleoclimate" }
  space-weather:          { name: "Space weather" }
  land-environment:       { name: "Land and environment" }
  water-resources:        { name: "Water resources" }
  terrain-elevation:      { name: "Terrain and elevation" }
  air-quality:            { name: "Air quality" }
  demographics:           { name: "Demographics" }
  agriculture:            { name: "Agriculture" }

# systems: the product family or service behind an entry, declared per provider.
# Datasets without an obvious family leave `system` unset.
systems:
  noaa:ncei-access:
    name: "NCEI Access Data Service"
    provider: noaa
    homepage: https://www.ncei.noaa.gov/support/access-data-service-api-user-documentation
  noaa:nexrad:
    name: "Next Generation Weather Radar (NEXRAD)"
    provider: noaa
    homepage: https://www.ncei.noaa.gov/products/radar/next-generation-weather-radar
  noaa:goes-r:
    name: "GOES-R Series"
    provider: noaa
    homepage: https://www.goes-r.gov/
  noaa:ncep-models:
    name: "NCEP model output"
    provider: noaa
    homepage: https://www.nco.ncep.noaa.gov/pmb/products/
  noaa:coops:
    name: "CO-OPS Data API"
    provider: noaa
    homepage: https://tidesandcurrents.noaa.gov/

datasets:
  # ---------------------------------------------------------------- NOAA
  - id: noaa:nexrad-level2
    provider: noaa
    status: available
    system: noaa:nexrad
    domain: weather-radar
    since: "0.2"
    title: NEXRAD Level II Radar
    description: >-
      Raw volume scans from the WSR-88D weather radar network, archived in the public
      unidata-nexrad-level2 S3 bucket (NOAA Open Data Dissemination). One object per radar site
      per volume scan. No server-side subsetting; whole files are fetched. Select radars by site
      id, bbox, or nearest to a point. Moments vary by sweep and volume coverage pattern; the
      catalog lists the ones the radar example's lowest sweep carries.
    keywords: [radar, weather, storms, tornado, precipitation, reflectivity, nexrad, wsr-88d]
    protocol: s3
    homepage: https://registry.opendata.aws/noaa-nexrad/
    license: US Government Work (public domain)
    spatial_extent: { west: -180.0, south: 15.0, east: -60.0, north: 72.0 }
    temporal_extent: { start: "1991-06-01T00:00:00Z" }
    capabilities: { spatial_subset: false, temporal_subset: true, variable_subset: false }
    summary: NEXRAD radar scans
    formats: [NEXRAD Level II]
    selection: Whole radar scans by site and inclusive UTC scan-start time
    inputs: Both timestamps; radar IDs or a geographic query
    reader: radar
    guide: docs/providers/noaa-nexrad.md
    examples:
      - examples/radar-reflectivity/example.ipynb
      - examples/event-context/example.ipynb
      - examples/tornado-classification/example.ipynb
      - examples/severe-weather-case-study/example.ipynb
    resolution:
      temporal: >-
        One volume scan every 4, 5, 6, or 10 minutes, set by the volume coverage pattern
    update_frequency: "New Level II data is added as soon as it is available"
    citation: >-
      NEXRAD on AWS was accessed on [date] from https://registry.opendata.aws/noaa-nexrad
    terms: https://www.noaa.gov/information-technology/open-data-dissemination
    variables:
      - { name: "DBZH", units: "dBZ", description: "Equivalent reflectivity factor H" }
      - { name: "ZDR", units: "dB", description: "Log differential reflectivity H/V" }
      - { name: "PHIDP", units: "degrees", description: "Differential phase HV" }
      - { name: "RHOHV", units: "unitless", description: "Correlation coefficient HV" }
    limits: { max_window: P31D }
    adapter: usdata.providers.noaa.nexrad:NexradLevel2

  - id: noaa:ghcn-daily
    provider: noaa
    status: available
    system: noaa:ncei-access
    domain: surface-weather
    since: "0.2"
    title: GHCN-Daily Station Observations
    description: >-
      Global Historical Climatology Network daily summaries: temperature, precipitation, snow,
      and other elements from land surface stations, served by the NCEI Access Data Service with
      station and date filtering. Variables are NCEI element codes and the catalog lists the
      common ones; the delivered set is open and depends on the station.
    keywords: [climate, weather, temperature, precipitation, snow, stations, daily, ghcn, ncei]
    protocol: http
    homepage: https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily
    license: US Government Work (public domain)
    spatial_extent: { west: -180.0, south: -90.0, east: 180.0, north: 90.0 }
    temporal_extent: { start: "1763-01-01T00:00:00Z" }
    capabilities: { spatial_subset: false, temporal_subset: true, variable_subset: true }
    summary: Daily station weather
    formats: [CSV]
    selection: Station observations within inclusive calendar dates; selected elements
    inputs: Both dates; station IDs or a geographic query
    reader: pandas
    guide: docs/providers/noaa-ghcn.md
    examples:
      - examples/weather-and-streamflow/example.ipynb
    resolution:
      spatial: >-
        Land surface stations; more than 100,000 stations in 180 countries and territories
      temporal: "Daily"
    update_frequency: >-
      Daily, reconstructed each weekend from more than 25 data source components
    latency: >-
      Real-time streams are replaced by archive-ready sources 45 to 60 days after the end of a
      month
    citation: >-
      Menne, M.J., I. Durre, R.S. Vose, B.E. Gleason, and T.G. Houston, 2012: An overview of the
      Global Historical Climatology Network-Daily Database. Journal of Atmospheric and Oceanic
      Technology, 29, 897-910, doi:10.1175/JTECH-D-11-00103.1
    terms: https://www.ncei.noaa.gov/metadata/geoportal/rest/metadata/item/gov.noaa.ncdc:C00861/html
    variables:
      - { name: "PRCP", units: "mm", description: "Precipitation total (metric units)" }
      - { name: "TMAX", units: "degrees Celsius", description: "Maximum temperature (metric units)" }
      - { name: "TMIN", units: "degrees Celsius", description: "Minimum temperature (metric units)" }
      - { name: "SNOW", units: "mm", description: "Snowfall (metric units)" }
      - { name: "SNWD", units: "mm", description: "Snow depth (metric units)" }
    adapter: usdata.providers.noaa.ghcnd:GhcnDaily

  - id: noaa:coastwatch-sst
    provider: noaa
    status: available
    domain: satellite-oceanography
    since: "0.5"
    title: CoastWatch Blended Sea Surface Temperature
    description: >-
      NOAA geo-polar blended daily SST analysis (day and night) on a global
      5 km grid, ERDDAP dataset noaacwBLENDEDsstDNDaily on the CoastWatch
      server, with server-side spatial, temporal, and variable subsetting. Raw CSV
      subsets retain grid coordinates and units without volatile NetCDF history.
    keywords: [ocean, sst, sea surface temperature, satellite, erddap, coastwatch, gridded, blended]
    protocol: erddap
    homepage: https://coastwatch.noaa.gov/erddap/griddap/noaacwBLENDEDsstDNDaily.html
    license: GHRSST free and open data
    spatial_extent: { west: -179.975, south: -89.975, east: 179.975, north: 89.975 }
    temporal_extent: { start: "2019-07-22T12:00:00Z" }
    capabilities: { spatial_subset: true, temporal_subset: true, variable_subset: true }
    summary: Sea-surface temperature
    formats: [CSV with units row]
    selection: Grid centers and timestamps inside the requested bounds; optional stride
    inputs: BBox or location, and both timestamps
    reader: pandas
    guide: docs/providers/noaa-coastwatch.md
    examples:
      - examples/sst-analysis/example.ipynb
    resolution:
      spatial: "0.05 degree global grid, about 5 km"
      temporal: "Daily"
    update_frequency: "Daily"
    citation: >-
      NOAA/NESDIS Office of Satellite Products and Operations, Geo-polar Blended Sea Surface
      Temperature Analysis (noaacwBLENDEDsstDNDaily), accessed via usdata
    terms: https://coastwatch.noaa.gov/erddap/info/noaacwBLENDEDsstDNDaily/index.html
    variables:
      - { name: "analysed_sst", units: "degree_C", description: "Analysed sea surface temperature" }
      - { name: "analysis_error", units: "degree_C", description: "Estimated error of the analysis" }
      - { name: "sea_ice_fraction", units: "1", description: "Sea ice area fraction" }
      - { name: "mask", description: "Source mask flags; consult the source metadata for the codes" }
    adapter: usdata.providers.noaa.coastwatch:CoastwatchSst

  - id: noaa:goes-abi
    provider: noaa
    status: available
    system: noaa:goes-r
    domain: weather-satellites
    since: "0.8"
    title: GOES-R ABI CONUS Cloud and Moisture Imagery
    description: >-
      Single-channel CONUS Cloud and Moisture Imagery (ABI-L2-CMIPC) from
      GOES-16, 17, 18, and 19 in anonymous NOAA S3 buckets. Select an explicit
      satellite, channel, and scan-start interval; each asset is a complete
      NetCDF scene with no geographic or variable subsetting.
    keywords: [satellite, imagery, goes, abi, clouds, infrared, reflectance, netcdf, conus]
    protocol: s3
    homepage: https://registry.opendata.aws/noaa-goes/
    license: US Government Work (public domain)
    temporal_extent: { start: "2017-02-28T00:00:00Z" }
    capabilities: { spatial_subset: false, temporal_subset: true, variable_subset: false }
    summary: GOES CONUS imagery
    formats: [NetCDF4]
    selection: Whole single-channel CONUS scenes by inclusive UTC scan-start time
    inputs: Satellite, channel, and both timestamps
    reader: netcdf
    guide: docs/providers/noaa-goes.md
    examples:
      - examples/goes-imagery/example.ipynb
      - examples/event-context/example.ipynb
    resolution:
      spatial: "0.5 km to 2 km at nadir, by ABI band"
      temporal: "One CONUS scan every 5 minutes on average"
    update_frequency: "New data is added as soon as it's available"
    citation: >-
      NOAA Geostationary Operational Environmental Satellites (GOES) 16, 17, 18 & 19 was
      accessed on [date] from https://registry.opendata.aws/noaa-goes
    terms: https://www.noaa.gov/information-technology/open-data-dissemination
    variables:
      - { name: "CMI", description: "Cloud and moisture imagery; reflectance factor or brightness temperature by band" }
      - { name: "DQF", description: "Per-pixel data quality flags for CMI" }
    limits: { max_window: P7D }
    adapter: usdata.providers.noaa.goes:GoesAbi

  - id: noaa:goes-glm
    provider: noaa
    status: available
    system: noaa:goes-r
    domain: weather-satellites
    since: "0.15"
    title: GOES Geostationary Lightning Mapper
    description: >-
      Lightning flash, group, and event detections (GLM-L2-LCFA) from GOES-16,
      17, 18, and 19 in anonymous NOAA S3 buckets. Select an explicit satellite
      and a file-start interval of at most one day; each asset is a complete
      20-second NetCDF detection table with no geographic subsetting.
    keywords: [lightning, glm, goes, satellite, storms, flashes, netcdf]
    protocol: s3
    homepage: https://registry.opendata.aws/noaa-goes/
    license: US Government Work (public domain)
    temporal_extent: { start: "2018-02-13T16:10:00Z" }
    capabilities: { spatial_subset: false, temporal_subset: true, variable_subset: false }
    summary: GOES lightning detections
    formats: [NetCDF4]
    selection: Whole 20-second detection files by inclusive UTC file-start time, at most one day
    inputs: Satellite and both timestamps
    reader: netcdf
    guide: docs/providers/noaa-glm.md
    examples:
      - examples/glm-flashes/example.ipynb
      - examples/tornado-classification/example.ipynb
      - examples/severe-weather-case-study/example.ipynb
    resolution:
      spatial: "8 to 14 km across the instrument's field of view"
      temporal: "One detection file every 20 seconds"
    update_frequency: "New data is added as soon as it's available"
    citation: >-
      NOAA Geostationary Operational Environmental Satellites (GOES) 16, 17, 18 & 19 was
      accessed on [date] from https://registry.opendata.aws/noaa-goes
    terms: https://www.noaa.gov/information-technology/open-data-dissemination
    variables:
      - { name: "flash_lat", units: "degrees_north", description: "Flash centroid latitude" }
      - { name: "flash_lon", units: "degrees_east", description: "Flash centroid longitude" }
      - { name: "flash_area", units: "m2", description: "Flash footprint area" }
      - { name: "flash_energy", units: "J", description: "Flash radiant energy" }
      - { name: "flash_time_offset_of_first_event", units: "CF datetime", description: "Time of the flash's first event" }
      - { name: "flash_time_offset_of_last_event", units: "CF datetime", description: "Time of the flash's last event" }
      - { name: "flash_quality_flag", description: "The source's own screening flag for the flash" }
      - { name: "group_lat", units: "degrees_north", description: "Group centroid latitude" }
      - { name: "group_lon", units: "degrees_east", description: "Group centroid longitude" }
      - { name: "group_area", units: "m2", description: "Group footprint area" }
      - { name: "group_energy", units: "J", description: "Group radiant energy" }
      - { name: "event_lat", units: "degrees_north", description: "Event latitude" }
      - { name: "event_lon", units: "degrees_east", description: "Event longitude" }
      - { name: "event_energy", units: "J", description: "Event radiant energy" }
    limits: { max_window: P1D }
    adapter: usdata.providers.noaa.glm:GoesGlm

  - id: noaa:storm-events
    provider: noaa
    status: available
    domain: severe-weather
    since: "0.8"
    title: Storm Events Database
    description: >-
      NCEI's significant-weather event details since 1950, with locations, impacts, and
      narratives. Anonymous whole-year gzipped CSV archives; select the latest creation-date
      revision for each requested year. No server-side row, location, or variable subsetting.
      Historical event coverage and reporting practices vary; fatalities and locations tables
      are separate products not included by this adapter. The catalog lists the identifying
      columns; the full column set is documented in the NCEI bulk format reference.
    keywords: [storms, tornado, hail, wind, flood, damage, severe weather, events]
    protocol: http
    homepage: https://www.ncei.noaa.gov/access/storm-events-database/
    license: US Government Work (public domain)
    temporal_extent: { start: "1950-01-01T00:00:00Z" }
    capabilities: { spatial_subset: false, temporal_subset: true, variable_subset: false }
    summary: Storm Events details
    formats: [gzip CSV]
    selection: Whole annual archives; filter rows locally after downloading
    inputs: Both dates (selects the containing years)
    reader: pandas
    guide: docs/providers/noaa-storm-events.md
    examples:
      - examples/storm-events/example.ipynb
      - examples/event-context/example.ipynb
      - examples/tornado-classification/example.ipynb
      - examples/severe-weather-case-study/example.ipynb
    resolution:
      spatial: "One record per county, forecast zone, or marine zone touched by an event"
      temporal: >-
        One record per reported event, timestamped in the reporting office's local time
    update_frequency: "The current year's file is updated each month"
    citation: >-
      NOAA National Centers for Environmental Information, Storm Events Database, accessed via
      usdata
    terms: https://www.ncei.noaa.gov/metadata/geoportal/rest/metadata/item/gov.noaa.ncdc:C00510/html
    variables:
      - { name: "EVENT_ID", description: "Identifier of one event record" }
      - { name: "EPISODE_ID", description: "Identifier grouping the events of one storm episode" }
      - { name: "CZ_TYPE", description: "County (C), forecast zone (Z), or marine (M) record" }
      - { name: "CZ_FIPS", description: "County or zone code; not always a county FIPS code" }
      - { name: "CZ_TIMEZONE", description: "Time zone of the record's local timestamps" }
      - { name: "TOR_F_SCALE", description: "Tornado rating as text, such as EF1" }
    adapter: usdata.providers.noaa.storm_events:StormEvents

  - id: noaa:spc-tornado-reports
    provider: noaa
    status: available
    domain: severe-weather
    since: "0.15"
    title: SPC Tornado Reports
    description: >-
      The Storm Prediction Center's tornado database since 1950 as plain CSV:
      one row per tornado or state/county segment with date, local time, EF
      or F rating, injuries, fatalities, loss, start and end coordinates, path
      length and width, and FIPS codes. Whole files linked from the SPC page:
      annual from 2008, half-decade for 2000-2007, decade for 1950-1999.
      Stable names revised in place; no server-side row, location, or
      variable subsetting.
    keywords: [tornado, spc, severe weather, storm reports, tracks, ef scale, fujita]
    protocol: http
    homepage: https://www.spc.noaa.gov/wcm/#data
    license: US Government Work (public domain)
    temporal_extent: { start: "1950-01-01T00:00:00Z" }
    capabilities: { spatial_subset: false, temporal_subset: true, variable_subset: false }
    summary: SPC tornado database
    formats: [CSV]
    selection: Whole annual, half-decade, or decade files; filter rows locally after downloading
    inputs: Both dates (selects the files covering those years)
    reader: pandas
    guide: docs/providers/noaa-spc-tornado.md
    examples:
      - examples/spc-tornadoes/README.md
      - examples/severe-weather-case-study/example.ipynb
    resolution:
      spatial: >-
        One row per tornado or per state and county segment, with start and end coordinates
      temporal: "One row per tornado, timestamped in Central Standard Time"
    update_frequency: >-
      Files are revised in place as NWS Storm Data is finalized; the page shows an update date
      per file
    citation: >-
      NOAA/NWS Storm Prediction Center, Severe Weather Database tornado files, accessed via
      usdata
    terms: https://www.weather.gov/disclaimer
    variables:
      - { name: "om", description: "Tornado number within the year, repeated across a tornado's segments" }
      - { name: "date", description: "Touchdown date" }
      - { name: "time", description: "Touchdown time" }
      - { name: "tz", description: "Time-zone code: 3 is Central Standard Time, 9 is GMT, ? is unknown" }
      - { name: "st", description: "Two-letter state" }
      - { name: "stf", description: "State FIPS code" }
      - { name: "mag", description: "F scale through January 2007 and EF scale afterwards; -9 is unknown" }
      - { name: "inj", units: "count", description: "Injuries" }
      - { name: "fat", units: "count", description: "Fatalities" }
      - { name: "loss", description: "Property loss: a 0 to 9 category before 1996, millions of dollars from 1996" }
      - { name: "closs", units: "millions of dollars", description: "Crop loss" }
      - { name: "slat", units: "degrees_north", description: "Start latitude" }
      - { name: "slon", units: "degrees_east", description: "Start longitude" }
      - { name: "elat", units: "degrees_north", description: "End latitude" }
      - { name: "elon", units: "degrees_east", description: "End longitude" }
      - { name: "len", units: "miles", description: "Path length" }
      - { name: "wid", units: "yards", description: "Path width" }
      - { name: "sg", description: "Segment code: 1 a whole track, 2 a state segment, -9 extra county codes" }
    adapter: usdata.providers.noaa.spc:SpcTornadoReports

  - id: noaa:hurdat2
    provider: noaa
    status: available
    domain: tropical-cyclones
    since: "0.12"
    title: HURDAT2 Atlantic and Pacific Best Tracks
    description: >-
      National Hurricane Center best-track database: six-hourly position,
      intensity, pressure, and wind radii for Atlantic (since 1851) and
      northeast/north-central Pacific (since 1949) tropical cyclones. One
      fixed-format text file per basin, revised after each season; a basin
      parameter picks the file and the newest revision wins. There is no
      query interface, so dates and geographic filters are rejected and the
      local reader turns the whole file into one row per track point.
    keywords: [hurricane, tropical cyclone, best track, nhc, atlantic, pacific]
    protocol: http
    homepage: https://www.nhc.noaa.gov/data/#hurdat
    license: US Government Work (public domain)
    temporal_extent: { start: "1851-01-01T00:00:00Z" }
    capabilities: { spatial_subset: false, temporal_subset: false, variable_subset: false }
    summary: Tropical cyclone best tracks
    formats: [HURDAT2 fixed-format text]
    selection: The newest revision of one whole basin file; filter track points locally
    inputs: Optional basin (atlantic or pacific); no dates or geographic filters
    reader: pandas
    guide: docs/providers/noaa-hurdat2.md
    examples:
      - examples/hurdat2/README.md
      - examples/storm-surge/example.ipynb
    resolution:
      spatial: "Best-track positions in tenths of a degree"
      temporal: "Six-hourly synoptic times, plus asynoptic records for landfalls and extremes"
    update_frequency: >-
      Annually, after each season's post-storm reanalysis; the 2025 season was added on
      2026-02-27
    citation: >-
      Landsea, C. W. and J. L. Franklin, 2013: Atlantic Hurricane Database Uncertainty and
      Presentation of a New Database Format. Mon. Wea. Rev., 141, 3576-3592
    terms: https://www.weather.gov/disclaimer
    variables:
      - { name: "storm_id", description: "ATCF-style basin, cyclone number, and year, such as AL042021" }
      - { name: "name", description: "Storm name, or UNNAMED" }
      - { name: "time", units: "UTC", description: "Track-point time" }
      - { name: "record_identifier", description: "Landfall (L), intensity peak (I), pressure minimum (P), and the other codes" }
      - { name: "status", description: "TD, TS, HU, EX, SD, SS, LO, WV, or DB" }
      - { name: "latitude", units: "degrees_north", description: "Track-point latitude" }
      - { name: "longitude", units: "degrees_east", description: "Track-point longitude in [-180, 180]" }
      - { name: "max_wind_kt", units: "knots", description: "Maximum sustained 1-minute surface wind" }
      - { name: "min_pressure_mb", units: "millibars", description: "Minimum central pressure" }
      - { name: "r34_ne_nm", units: "nautical miles", description: "34 kt wind extent, northeast quadrant" }
      - { name: "r34_se_nm", units: "nautical miles", description: "34 kt wind extent, southeast quadrant" }
      - { name: "r34_sw_nm", units: "nautical miles", description: "34 kt wind extent, southwest quadrant" }
      - { name: "r34_nw_nm", units: "nautical miles", description: "34 kt wind extent, northwest quadrant" }
      - { name: "r50_ne_nm", units: "nautical miles", description: "50 kt wind extent, northeast quadrant" }
      - { name: "r50_se_nm", units: "nautical miles", description: "50 kt wind extent, southeast quadrant" }
      - { name: "r50_sw_nm", units: "nautical miles", description: "50 kt wind extent, southwest quadrant" }
      - { name: "r50_nw_nm", units: "nautical miles", description: "50 kt wind extent, northwest quadrant" }
      - { name: "r64_ne_nm", units: "nautical miles", description: "64 kt wind extent, northeast quadrant" }
      - { name: "r64_se_nm", units: "nautical miles", description: "64 kt wind extent, southeast quadrant" }
      - { name: "r64_sw_nm", units: "nautical miles", description: "64 kt wind extent, southwest quadrant" }
      - { name: "r64_nw_nm", units: "nautical miles", description: "64 kt wind extent, northwest quadrant" }
