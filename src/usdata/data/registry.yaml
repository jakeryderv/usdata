    keywords: [vegetation, ndvi, land, climate data record, avhrr, viirs]
    protocol: s3
    homepage: https://www.ncei.noaa.gov/products/climate-data-records/normalized-difference-vegetation-index
    license: US Government Work (public domain)
    temporal_extent: { start: "1981-06-24T00:00:00Z" }
    capabilities: { spatial_subset: false, temporal_subset: true, variable_subset: false }

  # ---------------------------------------------------------------- USGS
  - id: usgs:water-daily
    provider: usgs
    status: available
    domain: water-resources
    since: "0.5"
