    homepage: https://www.ncei.noaa.gov/products/etopo-global-relief-model
    license: US Government Work (public domain)
    capabilities: { spatial_subset: true, temporal_subset: false, variable_subset: true }

  - id: noaa:nclimdiv
    provider: noaa
    status: planned
    domain: climate
    target: later
    title: nClimDiv Climate Divisional Data
    description: >-
      Monthly temperature, precipitation, and drought indices for U.S.
      climate divisions, states, and regions since 1895, as fixed-width text
