# Documentation composition keyed by stable dataset ID; validated by just docs.
  - id: noaa:rap
    provider: noaa
    status: available
    system: noaa:ncep-models
    domain: weather-models
    since: "0.20"
    title: RAP Model Output
    description: >-
      Rapid Refresh 13 km hourly analyses and forecasts in GRIB2 from the anonymous noaa-rap-pds
      S3 bucket, one whole file per run, forecast hour, and grid family. Select a run by
      initialization window and cycle hour, the forecast hours, and the file family: the 13 km
      CONUS pressure-level grid (about 18 MB per file), its secondary fields, or the native-grid
      pressure and hybrid-level files. Runs reach 21 hours, or 51 from the 03, 09, 15, and 21
      UTC runs. The server subsets nothing, so fields are chosen either by naming GRIB2 messages,
      which fetches their byte ranges through the object's index sidecar, or after download with
      the GRIB2 reader. Each file holds hundreds of fields; the catalog lists the handful the
      guide and example select.
    keywords: [forecast, model, rap, grib2, weather, nwp, cape, helicity, convective]
    protocol: s3
    homepage: https://registry.opendata.aws/noaa-rap/
    license: US Government Work (public domain)
    temporal_extent: { start: "2021-02-22T00:00:00Z" }
    capabilities: { spatial_subset: false, temporal_subset: true, variable_subset: false, partial_fetch: true }
    summary: RAP model output
    formats: [GRIB2]
    selection: Files, whole or by named GRIB2 message, chosen by run initialization window, cycle hour, forecast hours, and file family
    inputs: Both timestamps, cycle, and forecast_hour
    reader: grib
    guide: docs/providers/noaa-rap.md
    examples:
      - examples/rap-environment/README.md
    resolution:
      spatial: "13 km Lambert conformal CONUS grid, 451 x 337 points, for the awp130 family"
      temporal: >-
        Hourly runs; forecast hours to 21, or to 51 from the 03, 09, 15, and 21 UTC runs
    update_frequency: "Hourly"
    citation: >-
      NOAA Rapid Refresh (RAP) was accessed on [date] from https://registry.opendata.aws/noaa-rap
    terms: https://www.noaa.gov/information-technology/open-data-dissemination
    variables:
      - { name: "cape", units: "J/kg", description: "Convective available potential energy, surface or a ground layer" }
      - { name: "cin", units: "J/kg", description: "Convective inhibition, surface or a ground layer" }
      - { name: "hlcy", units: "m2/s2", description: "Storm-relative helicity over the 0-1 km and 0-3 km layers" }
      - { name: "refc", units: "dBZ", description: "Composite reflectivity" }
