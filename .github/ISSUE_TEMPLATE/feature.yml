name: Feature request
description: Propose a change to the SDK or CLI
labels: ["priority: normal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Sketch the CLI or Python API if you can.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
