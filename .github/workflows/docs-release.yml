name: Publish release documentation

# Initial v0.10.0 publication and reviewed docs-only corrections. No package release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing published package version (without v)
        required: true
        default: '0.10.0'
        type: string

permissions:
  contents: write
  actions: read
concurrency:
  group: release-documentation
  cancel-in-progress: false
jobs:
  docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Require existing release and successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "v$VERSION" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -qx true
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')
          test -n "$run_id"
          uv sync --group docs --no-default-groups
      - name: Build against released code and reviewed documentation
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --no-project python scripts/release_docs.py --package-ref "v$VERSION"
      - name: Attach verified archives to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # The descriptor is the ready marker; attach it after both data archives.
          gh release upload "v$VERSION" .build/release-docs/*.zip .build/release-docs/*.gz --clobber
          gh release upload "v$VERSION" .build/release-docs/*.json --clobber
  upload:
    needs: docs
    uses: ./.github/workflows/docs-publish.yml
    with:
      version: ${{ inputs.version }}
      docs_commit: ${{ github.sha }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
