name: Upload documentation to R2

# Also provides an archive-only retry/rollback: no rebuilding or package release.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      docs_commit:
        required: true
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published package version (without v)
        required: true
        type: string
      docs_commit:
        description: Full reviewed docs commit with existing release archives
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: docs-r2-publication
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Download exact published archives
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DOCS_COMMIT: ${{ inputs.docs_commit }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DOCS_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$DOCS_COMMIT" origin/main
          gh release view "v$VERSION" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -qx true
          gh release download "v$VERSION" --dir release-docs --pattern "usdata-docs-$DOCS_COMMIT.json" --pattern "usdata-docs-$DOCS_COMMIT.ndjson.gz"
          uv sync --locked --group docs-publish --no-default-groups
      - name: Validate, upload, and promote the complete snapshot
        env:
          VERSION: ${{ inputs.version }}
          DOCS_COMMIT: ${{ inputs.docs_commit }}
          R2_ENDPOINT_URL: https://d4e3fe7d69a3ac8f446d4c3de2ca051b.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          package_commit=$(git rev-parse "v$VERSION^{commit}")
          uv run --no-sync python scripts/publish_docs.py "release-docs/usdata-docs-$DOCS_COMMIT.json" \
            --version "$VERSION" --package-commit "$package_commit" --docs-commit "$DOCS_COMMIT"
