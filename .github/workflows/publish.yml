name: Publish to PyPI

# Publish only the exact main-branch commit whose CI has succeeded.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}
      - name: Require successful main CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&branch=main&event=push&per_page=100" \
            --jq 'any(.workflow_runs[]; .conclusion == "success")')
          test "$passed" = true
      - uses: astral-sh/setup-uv@v7
      - id: version
        run: |
          v=$(uv version --short)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "v$v already tagged; nothing to publish"
          fi
      - if: steps.version.outputs.tagged != 'true'
        run: uv build
      - if: steps.version.outputs.tagged != 'true'
        run: uv publish --check-url https://pypi.org/simple/usdata/
      - if: steps.version.outputs.tagged != 'true'
        name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          uv run --no-project python scripts/changelog.py notes "$V" > notes.md
          gh release create "v$V" --target "$RELEASE_SHA" --title "v$V" --notes-file notes.md
