name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv lock --check
      - run: just setup
      - run: just check-static
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/
          retention-days: 7

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        readers: [core, pandas, radar, netcdf]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: extractions/setup-just@v4
      - if: matrix.readers == 'core'
        run: just setup
      - if: matrix.readers == 'pandas'
        run: uv sync --group dev --extra pandas
      - if: matrix.readers == 'radar'
        run: uv sync --group dev --extra radar
      - if: matrix.readers == 'netcdf'
        run: uv sync --group dev --extra netcdf
      - name: Check dependency profile
        env:
          EXPECT_PANDAS: ${{ matrix.readers != 'core' && '1' || '0' }}
          EXPECT_XARRAY: ${{ (matrix.readers == 'radar' || matrix.readers == 'netcdf') && '1' || '0' }}
          EXPECT_RADAR: ${{ matrix.readers == 'radar' && '1' || '0' }}
        run: >-
          uv run --no-sync python -c
          "import importlib.util, os; assert (importlib.util.find_spec('pandas') is not None) == (os.environ['EXPECT_PANDAS'] == '1'); assert (importlib.util.find_spec('xradar') is not None) == (os.environ['EXPECT_RADAR'] == '1'); assert (importlib.util.find_spec('xarray') is not None) == (os.environ['EXPECT_XARRAY'] == '1')"
      - run: >-
          just check-tests --junitxml=reports/junit.xml
          --cov-report=xml:reports/coverage.xml --cov-report=json:reports/coverage.json
          --durations=15
        env:
          UV_NO_SYNC: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.python }}-${{ matrix.readers }}
          path: reports/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
      - name: Validate distributions
        run: uv run --no-project python scripts/check_dist.py dist --version "$(uv version --short)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: uv run --no-project python scripts/smoke_wheel.py --radar --netcdf

  # Single required status check for branch protection.
  ci:
    needs: [static, check, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.smoke.result }}" = "success"
