name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv lock --check
      - run: just setup
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: hooks-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
      - name: Validate squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/check_pr_title.py
      - name: Require a release note or an internal-change explanation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run towncrier check --compare-with "$BASE_SHA"
      - run: just check-static
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation
          path: .build/docs-site/
          retention-days: 7

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        readers: [core, pandas, radar, netcdf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - if: matrix.readers == 'core'
        run: just setup
      - if: matrix.readers == 'pandas'
        run: uv sync --group dev --extra pandas
      - if: matrix.readers == 'radar'
        run: uv sync --group dev --extra radar
      - if: matrix.readers == 'netcdf'
        run: uv sync --group dev --extra netcdf
      - name: Check dependency profile
        env:
          EXPECT_PANDAS: ${{ matrix.readers != 'core' && '1' || '0' }}
          EXPECT_XARRAY: ${{ (matrix.readers == 'radar' || matrix.readers == 'netcdf') && '1' || '0' }}
          EXPECT_RADAR: ${{ matrix.readers == 'radar' && '1' || '0' }}
        run: >-
          uv run --no-sync python -c
          "import importlib.util, os; assert (importlib.util.find_spec('pandas') is not None) == (os.environ['EXPECT_PANDAS'] == '1'); assert (importlib.util.find_spec('xradar') is not None) == (os.environ['EXPECT_RADAR'] == '1'); assert (importlib.util.find_spec('xarray') is not None) == (os.environ['EXPECT_XARRAY'] == '1')"
      - run: >-
          just check-tests --junitxml=reports/junit.xml
          --cov-report=xml:reports/coverage.xml --cov-report=json:reports/coverage.json
          --durations=15
        env:
          UV_NO_SYNC: '1'
      - name: Summarize offline results
        if: always()
        env:
          LABEL: Python ${{ matrix.python }} / ${{ matrix.readers }}
        run: python scripts/ci_summary.py --label "$LABEL" --junit reports/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: tests-${{ matrix.python }}-${{ matrix.readers }}
          path: reports/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv build
      - name: Validate distributions
        run: uv run --no-project python scripts/check_dist.py dist --version "$(uv version --short)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  website:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: documentation
          path: .build/docs-site
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm run check --prefix web
      - run: cd web && npx wrangler deploy --dry-run
      - run: cd web && npx wrangler deploy --config ../docs/hosting/wrangler.jsonc --dry-run

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - run: uv run --no-project python scripts/smoke_wheel.py --radar --netcdf

  # Single required status check for branch protection.
  ci:
    needs: [static, check, build, smoke, website]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.smoke.result }}" = "success"
          test "${{ needs.website.result }}" = "success"
