name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        readers: [core, pandas]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: extractions/setup-just@v4
      - name: Lockfile is in sync with pyproject
        run: uv lock --check
      - if: matrix.readers == 'core'
        run: just setup
      - if: matrix.readers == 'pandas'
        run: uv sync --all-groups --extra pandas
      - name: Check dependency profile
        env:
          EXPECT_PANDAS: ${{ matrix.readers == 'pandas' && '1' || '0' }}
        run: >-
          uv run --no-sync python -c
          "import importlib.util, os; assert (importlib.util.find_spec('pandas') is not None) == (os.environ['EXPECT_PANDAS'] == '1')"
      - run: just check
        env:
          UV_NO_SYNC: '1'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
      - name: Validate distributions
        run: uv run --no-project python scripts/check_dist.py dist --version "$(uv version --short)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: uv run --no-project python scripts/smoke_wheel.py

  # Single required status check for branch protection.
  ci:
    needs: [check, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.smoke.result }}" = "success"
