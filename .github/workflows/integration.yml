name: Integration

# External availability must not block normal pull requests.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run (weekly runs always use all)
        type: choice
        options: [all, live, notebooks, restores, minimum]
        default: all
      target:
        description: Optional live module (coops), notebook folder (noaa-coastwatch-sst), or pinned example (noaa-goes-glm); blank runs the scope
        type: string
        default: ''

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      minimum: ${{ steps.discover.outputs.minimum }}
      live: ${{ steps.discover.outputs.live }}
      notebooks: ${{ steps.discover.outputs.notebooks }}
      restores: ${{ steps.discover.outputs.restores }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: discover
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
          TARGET: ${{ inputs.target || '' }}
        run: python scripts/ci_inventory.py --scope "$SCOPE" --target "$TARGET" >> "$GITHUB_OUTPUT"

  live:
    needs: inventory
    if: needs.inventory.outputs.live != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.live) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - if: matrix.extra == 'core'
        run: just setup
      - if: matrix.extra != 'core'
        env:
          READER_EXTRA: ${{ matrix.extra }}
        run: uv sync --group dev --extra "$READER_EXTRA"
      - env:
          LIVE_TEST: ${{ matrix.path }}
          UV_NO_SYNC: '1'
          # Keyed sources read these (ADR 0039); anonymous ones ignore them.
          USDATA_AQS_EMAIL: ${{ secrets.USDATA_AQS_EMAIL }}
          USDATA_AQS_KEY: ${{ secrets.USDATA_AQS_KEY }}
        run: just test-live "$LIVE_TEST" --junitxml=reports/live.xml --durations=15
      - name: Summarize live results
        if: always()
        env:
          LABEL: ${{ matrix.id }}
        run: python scripts/ci_summary.py --label "$LABEL" --junit reports/live.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: live-${{ matrix.id }}
          path: reports/
          retention-days: 14

  notebooks:
    needs: inventory
    if: needs.inventory.outputs.notebooks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - env:
          NOTEBOOK: ${{ matrix.path }}
          USDATA_AQS_EMAIL: ${{ secrets.USDATA_AQS_EMAIL }}
          USDATA_AQS_KEY: ${{ secrets.USDATA_AQS_KEY }}
        run: just run-notebooks --notebook "$NOTEBOOK" --output-dir reports/notebooks
      - name: Summarize notebook results
        if: always()
        env:
          LABEL: ${{ matrix.path }}
        run: python scripts/ci_summary.py --label "$LABEL" --notebooks reports/notebooks/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: notebook-${{ matrix.id }}
          path: reports/
          retention-days: 14

  # Restore each committed example lockfile into an empty cache (ADR 0029).
  restore:
    needs: inventory
    if: needs.inventory.outputs.restores != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.restores) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just setup
      - env:
          MANIFEST: ${{ matrix.path }}
          UV_NO_SYNC: '1'
          # Upstream is always tried first; the mirror only answers for bytes the source stopped serving.
          USDATA_MIRROR_URL: https://data.usdata.dev
          USDATA_AQS_EMAIL: ${{ secrets.USDATA_AQS_EMAIL }}
          USDATA_AQS_KEY: ${{ secrets.USDATA_AQS_KEY }}
        run: uv run python scripts/restore_lockfiles.py --manifest "$MANIFEST" --output-dir reports/restore --cache "$RUNNER_TEMP/cache"
      - name: Mirror the pinned objects this restore proved (ADR 0030)
        # Only a passing restore on main uploads, and only objects the mirror lacks.
        if: success() && github.ref == 'refs/heads/main'
        env:
          MANIFEST: ${{ matrix.path }}
          UV_NO_SYNC: '1'
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://d4e3fe7d69a3ac8f446d4c3de2ca051b.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: uv run python scripts/mirror_pinned.py upload --manifest "$MANIFEST" --cache "$RUNNER_TEMP/cache"
      - name: Summarize restore results
        if: always()
        env:
          LABEL: restore ${{ matrix.id }}
        run: python scripts/ci_summary.py --label "$LABEL" --restore reports/restore/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: restore-${{ matrix.id }}
          path: reports/
          retention-days: 14

  minimum-dependencies:
    needs: inventory
    if: needs.inventory.outputs.minimum == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Resolve minimum direct runtime dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install pytest pytest-cov respx
          uv pip install --upgrade --resolution lowest-direct -e .
          mkdir -p reports
          uv pip freeze > reports/minimum-requirements.txt
      - name: Run offline suite without resynchronizing the lockfile
        run: .venv/bin/python -m pytest --cov=usdata --cov-branch --cov-report=xml:reports/coverage.xml --junitxml=reports/minimum.xml --durations=15
      - name: Summarize minimum-dependency results
        if: always()
        run: python scripts/ci_summary.py --label minimum-dependencies --junit reports/minimum.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: minimum-dependencies
          path: reports/
          retention-days: 14
